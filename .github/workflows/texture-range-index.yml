name: KYTY-INDEX-001 Windows range-index research

on:
  push:
    branches:
      - perf/texture-range-index

permissions:
  contents: read

concurrency:
  # Only latest feature-branch push needs a full emulator build.
  # Preserve earlier evidence in artifacts of already-completed runs.
  group: texture-range-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  range-standalone:
    name: Windows x64 - pure C++20 differential fast gate
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup clang-cl
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build independent oracle and candidate tests
        shell: pwsh
        run: |
          clang-cl /nologo /std:c++20 /O2 /EHsc /I src tests/ImageRangeIndexTests.cpp /Fe:image_range_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl /nologo /std:c++20 /O2 /EHsc /I tests/TextureRangeSupport /I src tests/ImagePageTableTests.cpp /Fe:image_page_table_tests_fast.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl /nologo /std:c++20 /O2 /EHsc /I tests/TextureRangeSupport /I src tests/ImageRangeIndexBench.cpp /Fe:image_range_bench_fast.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl /nologo /std:c++20 /O2 /EHsc /I tests/TextureRangeSupport /I src tests/ImageRangeHybridTests.cpp /Fe:image_range_hybrid_tests_fast.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl /nologo /std:c++20 /O2 /EHsc /I tests/TextureRangeSupport /I src tests/ImageRangeHybridBench.cpp /Fe:image_range_hybrid_bench_fast.exe /link Psapi.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl /nologo /std:c++20 /O2 /EHsc /I tests/TextureRangeSupport /I src tests/ImageRangeAllocationBench.cpp /Fe:image_range_alloc_fast.exe /link Psapi.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl /nologo /std:c++20 /O2 /EHsc /I tests/TextureRangeSupport /I src tests/ImageRangeColdMixBench.cpp /Fe:image_range_cold_mix_fast.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl /nologo /std:c++20 /O2 /EHsc /I tests/TextureRangeSupport /I src tests/ImageRangeHeapLedgerBench.cpp /Fe:image_range_heap_ledger_fast.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl /nologo /std:c++20 /O2 /EHsc /I src tests/TextureRangeTelemetryTests.cpp /Fe:texture_range_telemetry_fast.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl /nologo /std:c++20 /O2 /EHsc /I src tests/TextureWorkloadAttributionTests.cpp /Fe:texture_workload_attribution_fast.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl /nologo /std:c++20 /O2 /EHsc /I tests/TextureRangeSupport /I src tests/NativeLazyRangeSidecarTests.cpp /Fe:native_lazy_range_sidecar_fast.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run differential oracle
        shell: pwsh
        run: |
          .\\image_range_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\\image_page_table_tests_fast.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\\image_range_hybrid_tests_fast.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\\texture_range_telemetry_fast.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\\texture_workload_attribution_fast.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\\native_lazy_range_sidecar_fast.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run pure CPU A/B/C benchmark
        shell: pwsh
        run: |
          .\\image_range_bench_fast.exe > range-index-bench-fast.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\\image_range_hybrid_bench_fast.exe > range-hybrid-bench-fast.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\\image_range_cold_mix_fast.exe > range-cold-mix-fast.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure isolated inline storage allocations
        shell: pwsh
        run: |
          'variant,owners,small_64_new_calls,small_64_requested_bytes,wide_64_new_calls,wide_64_requested_bytes,private_before,private_after_register,private_after_snapshot,private_after_queries,working_set_after,peak_process_working_set,generation,snapshot_builds' | Set-Content -Path range-allocation-fast.csv -Encoding ascii
          foreach ($mode in 0..4) {
            foreach ($owners in @(1,16,40)) {
              .\\image_range_alloc_fast.exe $mode $owners | Add-Content -Path range-allocation-fast.csv -Encoding ascii
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Isolated C++ heap high-water across owner capacities
        shell: pwsh
        run: |
          'variant,owners,live_after_registration,live_after_snapshot,live_after_queries,peak_after_registration,peak_lifetime_bytes,allocation_calls,free_calls,requested_total_bytes,observed_hits,snapshot_builds,storage_estimate_bytes' | Set-Content -Path range-heap-ledger-fast.csv -Encoding ascii
          foreach ($variant in 0..2) {
            foreach ($owners in @(1,16,40,256)) {
              .\\image_range_heap_ledger_fast.exe $variant $owners | Add-Content -Path range-heap-ledger-fast.csv -Encoding ascii
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Validate offline telemetry interpretation
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_texture_range_telemetry_analyzer.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_texture_workload_attribution_analyzer.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload fast CPU benchmark evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texture-index-fast-windows-${{ github.sha }}
          path: |
            range-index-bench-fast.csv
            range-hybrid-bench-fast.csv
            range-allocation-fast.csv
            range-cold-mix-fast.csv
            range-heap-ledger-fast.csv
          if-no-files-found: warn

  windows-range-index:
    name: Windows x64 - differential oracle and index candidates
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - name: Checkout feature branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: MSVC tools for clang-cl
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $root = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$root\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          "root=$root" >> $env:GITHUB_OUTPUT
          "port_hash=$portHash" >> $env:GITHUB_OUTPUT

      - name: Cache glslang tools
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $root = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
          }
          "$root\installed\x64-windows\tools\glslang" >> $env:GITHUB_PATH

      - name: Setup compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Record toolchain
        shell: pwsh
        run: |
          clang-cl --version
          cmake --version
          ninja --version
          glslangValidator --version
          "SHA=${{ github.sha }}" | Out-File -FilePath runner-details.txt
          "OS=${{ runner.os }}" | Out-File -FilePath runner-details.txt -Append
          "CPU=$env:PROCESSOR_IDENTIFIER" | Out-File -FilePath runner-details.txt -Append

      - name: Configure without Qt launcher
        shell: cmd
        run: |
          cmake -S . -B _Build/windows-range ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DKYTY_BUILD_LAUNCHER=OFF ^
            -DKYTY_TEXTURE_RANGE_TELEMETRY=ON ^
            -DKYTY_TEXTURE_WORKLOAD_TELEMETRY=ON ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build standalone CPU tests
        shell: cmd
        run: |
          cmake --build _Build/windows-range --target image_range_index_tests image_page_table_tests image_range_index_bench image_range_hybrid_tests image_range_hybrid_bench image_range_allocation_bench image_range_native_id_tests image_range_cold_mix_bench image_range_heap_ledger_bench texture_range_telemetry_tests texture_workload_attribution_tests native_lazy_range_sidecar_tests --parallel 3

      - name: Deterministic differential checks
        shell: cmd
        run: |
          ctest --test-dir _Build/windows-range --output-on-failure -R "^(image_range_index|image_range_hybrid|image_range_native_id|image_page_table|texture_range_telemetry|texture_workload_attribution|native_lazy_range_sidecar)$"

      - name: A/B/C deterministic CPU replay
        shell: cmd
        run: |
          _Build\windows-range\image_range_index_bench.exe > range-index-bench.csv
          _Build\windows-range\image_range_hybrid_bench.exe > range-hybrid-bench.csv
          _Build\windows-range\image_range_cold_mix_bench.exe > range-cold-mix.csv
      - name: Measure CMake isolated allocation ledger
        shell: pwsh
        run: |
          'variant,owners,small_64_new_calls,small_64_requested_bytes,wide_64_new_calls,wide_64_requested_bytes,private_before,private_after_register,private_after_snapshot,private_after_queries,working_set_after,peak_process_working_set,generation,snapshot_builds' | Set-Content -Path range-allocation.csv -Encoding ascii
          foreach ($mode in 0..4) {
            foreach ($owners in @(1,16,40)) {
              .\\_Build\\windows-range\\image_range_allocation_bench.exe $mode $owners | Add-Content -Path range-allocation.csv -Encoding ascii
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: CMake isolated heap lifecycle ledger
        shell: pwsh
        run: |
          'variant,owners,live_after_registration,live_after_snapshot,live_after_queries,peak_after_registration,peak_lifetime_bytes,allocation_calls,free_calls,requested_total_bytes,observed_hits,snapshot_builds,storage_estimate_bytes' | Set-Content -Path range-heap-ledger.csv -Encoding ascii
          foreach ($variant in 0..2) {
            foreach ($owners in @(1,16,40,256)) {
              .\\_Build\\windows-range\\image_range_heap_ledger_bench.exe $variant $owners | Add-Content -Path range-heap-ledger.csv -Encoding ascii
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      # Builds *all* emulator C++ source files on a GitHub-hosted Windows runner,
      # with the Qt launcher disabled. CPU-only CLI smoke avoids Vulkan/GPU.
      - name: Build complete Windows emulator target
        shell: cmd
        run: |
          cmake --build _Build/windows-range --target kyty_emulator --parallel 3

      - name: Headless emulator CLI smoke test
        shell: cmd
        run: |
          ctest --test-dir _Build/windows-range --output-on-failure --timeout 60 -R "^emulator_user_name_cli$"
          if exist texture-range-telemetry.csv (
            echo Telemetry emitted without runtime opt-in!
            exit /b 1
          )
          if exist texture-workload-attribution.csv (
            echo Workload telemetry emitted without runtime opt-in!
            exit /b 1
          )

      - name: Upload machine and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-range-index-windows-${{ github.sha }}
          path: |
            runner-details.txt
            range-index-bench.csv
            range-hybrid-bench.csv
            range-allocation.csv
            range-cold-mix.csv
            range-heap-ledger.csv
          if-no-files-found: warn
